name: ruyayorumlayici

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: backend
    network_mode: "bridge"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - CHOKIDAR_USEPOLLING=true # Ensures hot-reloading works on Windows host bind mounts
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: frontend
    network_mode: "bridge"
    ports:
      - "8081:8081"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.expo
    env_file:
      - ./frontend/.env
    environment:
      - NODE_ENV=development
      - WATCHMAN_USE_POLLING=1 # Ensures Metro/Watchman notices file changes on Windows hosts
      - CHOKIDAR_USEPOLLING=true
      # - REACT_NATIVE_PACKAGER_HOSTNAME=192.168.1.XX # Uncomment and replace with your local LAN IP to test on a physical phone via Expo Go
    stdin_open: true # Keeps the terminal interactive for Expo keyboard commands
    tty: true
